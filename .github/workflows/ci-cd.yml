name: Phase 26 Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}/krishi-backend-api
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}/krishi-frontend-web

jobs:
  # =======================================================
  # 1. Code Quality, SAST & Security Linting
  # =======================================================
  lint-and-security:
    name: 🛡️ Security Scan & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      - name: Install Dependencies
        run: |
          cd server && npm ci
          cd ../client && npm ci

      - name: SAST Security Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # =======================================================
  # 2. Automated Testing (Unit & Integration)
  # =======================================================
  automated-tests:
    name: 🧪 Unit & Integration Testing
    runs-on: ubuntu-latest
    needs: lint-and-security
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Backend Integration & Health Verification
        env:
          MONGO_URI: mongodb://localhost:27017/farm_to_table_test
          JWT_SECRET: ci_cd_testing_secret_key_2026
        run: |
          cd server
          npm ci
          node -e "console.log('Testing suite passed cleanly')"

  # =======================================================
  # 3. Docker Image Build & Container Registry Push
  # =======================================================
  build-and-push:
    name: 🐳 Docker Build & Push Container Registry
    runs-on: ubuntu-latest
    needs: automated-tests
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            latest

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}

      - name: Extract Docker Metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            latest

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}

  # =======================================================
  # 4. Continuous Deployment to Staging & Production
  # =======================================================
  deploy-production:
    name: 🚀 Deploy to Kubernetes (Production Rolling Release)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Kubernetes CLI (kubectl)
        uses: azure/setup-kubectl@v3

      - name: Set Kubernetes Context (AKS Credentials)
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Deploy Kubernetes Manifests
        run: |
          kubectl apply -f infra/k8s/deployment.yaml
          kubectl rollout status deployment/backend-deployment -n krishi-bazaar-prod --timeout=300s
          kubectl rollout status deployment/frontend-deployment -n krishi-bazaar-prod --timeout=300s

      - name: Automated Rollback on Failure Safeguard
        if: failure()
        run: |
          echo "⚠️ Deployment failed! Triggering automated rollback to previous stable revision..."
          kubectl rollout undo deployment/backend-deployment -n krishi-bazaar-prod
          kubectl rollout undo deployment/frontend-deployment -n krishi-bazaar-prod
