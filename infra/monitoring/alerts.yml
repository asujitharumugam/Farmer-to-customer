groups:
  - name: krishi_bazaar_alerts
    rules:
      - alert: APIInstanceDown
        expr: up{job="krishi-backend-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Krishi Bazaar API instance is unreachable"
          description: "API instance on target {{ $labels.instance }} has been down for more than 1 minute."

      - alert: High5xxErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) * 100 > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx HTTP Error Rate Detected (> 5%)"
          description: "5xx error rate is currently at {{ $value }}%."
