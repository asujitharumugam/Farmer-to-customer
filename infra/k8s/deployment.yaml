# =========================================================
# Phase 26: Complete Production Kubernetes Manifests (k8s)
# Krishi Bazaar - Farmer to Customer Platform
# =========================================================

apiVersion: v1
kind: Namespace
metadata:
  name: krishi-bazaar-prod
---
# ---------------------------------------------------------
# ConfigMap for Application Settings
# ---------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: krishi-config
  namespace: krishi-bazaar-prod
data:
  NODE_ENV: "production"
  PORT: "5000"
  MONGO_URI: "mongodb://mongodb-service:27017/farm_to_table"
  REDIS_URL: "redis://redis-service:6379"
---
# ---------------------------------------------------------
# Secrets for Confidential Keys
# ---------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: krishi-secrets
  namespace: krishi-bazaar-prod
type: Opaque
stringData:
  JWT_SECRET: "super_secret_farm_to_table_jwt_key_2026_production"
  CLOUDINARY_CLOUD_NAME: "demo_cloud"
  CLOUDINARY_API_KEY: "123456789012345"
  CLOUDINARY_API_SECRET: "demo_cloudinary_secret"
  STRIPE_SECRET_KEY: "sk_test_mock_stripe_key"
---
# ---------------------------------------------------------
# Redis Deployment & Service
# ---------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  namespace: krishi-bazaar-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: krishi-bazaar-prod
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis
---
# ---------------------------------------------------------
# Backend API Deployment & Service
# ---------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: krishi-bazaar-prod
  labels:
    app: backend-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      containers:
      - name: backend-api
        image: ghcr.io/asujitharumugam/krishi-backend-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: krishi-config
        - secretRef:
            name: krishi-secrets
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: krishi-bazaar-prod
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
  selector:
    app: backend-api
---
# ---------------------------------------------------------
# Horizontal Pod Autoscaler (HPA) for Backend API
# ---------------------------------------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: krishi-bazaar-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-deployment
  minReplicas: 3
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
# ---------------------------------------------------------
# Frontend React Nginx Deployment & Service
# ---------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: krishi-bazaar-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-web
  template:
    metadata:
      labels:
        app: frontend-web
    spec:
      containers:
      - name: frontend-web
        image: ghcr.io/asujitharumugam/krishi-frontend-web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: krishi-bazaar-prod
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: frontend-web
---
# ---------------------------------------------------------
# Ingress Controller with SSL TLS Termination
# ---------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: krishi-ingress
  namespace: krishi-bazaar-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  tls:
  - hosts:
    - krishibazaar.com
    - api.krishibazaar.com
    secretName: krishibazaar-tls-cert
  rules:
  - host: krishibazaar.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
  - host: api.krishibazaar.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 5000
---
# ---------------------------------------------------------
# Pod Disruption Budget (High Availability Safeguard)
# ---------------------------------------------------------
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: krishi-bazaar-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: backend-api
